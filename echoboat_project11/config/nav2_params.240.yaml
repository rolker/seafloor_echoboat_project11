# EchoBoat 240 hull-model overlay (#3).
# Geometry + dynamics that differ by hull; merged over nav2_params.base.yaml at
# launch (see nav2_bringup_launch.py).
# Footprint re-tuned to the real 240 hull (#3 step 4): ~1.95 m x 1.0 m bounding
# box from bizzyboat.urdf.xacro side bumpers (1.80 m @ y=±0.47), stern AutoNav
# box (x≈-0.99), under the fwd camera/rail overhang. Replaces the Izzy-inherited
# 1.5 x 0.6 footprint. Behavior change → on-water validation. Dynamics knobs
# (turning radius, rotational vel) were already corrected via #124 and match the
# current-corrected specs in unh_echoboats_project11/docs/bizzyboat_performance.md.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.95, 0.5], [0.95, -0.5], [-1.0, -0.5], [-1.0, 0.5]]"

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 1.5
      footprint: "[[0.95, 0.5], [0.95, -0.5], [-1.0, -0.5], [-1.0, 0.5]]"

planner_server:
  ros__parameters:
    GridBased:
      minimum_turning_radius: 1.5

behavior_server:
  ros__parameters:
    hover:
      minimum_radius: 2.5
      maximum_radius: 10.0
      maximum_speed: 1.0
      maximum_rotation_speed: 0.75
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    # Yaw is governed by the ACCELERATION cap, not the speed cap (#36). The #197
    # snap-roll was a yaw *step* (snapped to 1.0 rad/s and reversed → ±30° hull
    # roll), not over-speed. So the steady-state yaw rate keeps the full 1.0 rad/s
    # vectored-thrust capability (matching the helm max_yaw_speed backstop) while
    # the yaw accel/decel cap (±0.5 rad/s², ~2 s ramp 0→1.0) spreads the moment
    # buildup that drove the roll. Starting value — sim/on-water tunable.
    max_velocity: [2.75, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.8, 0.0, 0.5]
    max_decel: [-0.45, 0.0, -0.5]
