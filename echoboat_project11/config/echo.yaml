/**/platform_sender:
  ros__parameters:
    width: 0.8
    length: 1.75
    reference_x: -.225
    reference_y: 0.05
    color:
      red: 1.0
      green: 1.0
      blue: 0.0

    nav:
      source_names:
        - mru
      sources:
        mru:
          topics:
            orientation: "mavros/imu/data"
            position: "mavros/global_position/raw/fix"
            velocity: "mavros/global_position/raw/gps_vel"


/**/mru_transform:
  ros__parameters:
    sensors:
      mru:
        topics:
          orientation: "mavros/imu/data"
          position: "mavros/global_position/raw/fix"
          velocity: "mavros/global_position/raw/gps_vel"
    sensor_names:
    - mru

/**/helm_manager:
  ros__parameters:
    output_type: 'twist'
    max_speed: 2.0
    max_yaw_speed: 1.5


/**/mavros:
  ros__parameters:
    conn.timesync_rate: 0.0
    global_position:
      tf.send: false
    local_position:
      tf.send: false
    tgt_system: 1
    tgt_component : 1
    system_id: 255
    component_id: 240
    setpoint_velocity:
      mav_frame: "BODY_NED"


/**/navigator:
  ros__parameters:

    survey_lead_in_distance: 3.5
    robot:
      turn_radius: 4.0

      max_velocity:
        linear.x: 2.0
        angular.z: 1.5

      default_velocity:
        linear.x: 1.5

      max_acceleration:
        linear.x: 0.75
        angular.z: 0.8

      default_acceleration:
        linear.x: 0.7
        angular.z: .3

      default_deceleration:
        linear.x: -0.35
        angular.z: -0.3

      max_deceleration:
        linear.x: -0.7
        angular.z: -0.8

      footprint: "[[1.0, 0], [0.0, 0.3], [-0.5, 0.3], [-0.5, -0.3], [0.0, -0.3], [1.0, 0]]"
      radius: 2.5

    costmap:
      global_frame: echo/map
      robot_base_frame: echo/base_link
      transform_tolerance: 1.0

    path_follower:
      pid:
        Kp: 20.0
        Ki: 0.5
        Kd: 0.6

